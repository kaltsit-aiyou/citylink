# 应用名称，会显示在部分启动日志中。
spring.application.name=backend

# 数据库地址：连接本机 3306 端口上的 citylink 数据库。
spring.datasource.url=jdbc:mysql://localhost:3306/citylink

# 应用使用专门的数据库账号，而不是 MySQL 管理员账号。
spring.datasource.username=citylink_app

# 从 Windows 环境变量读取密码；不要把真实密码写进此文件。
spring.datasource.password=${CITYLINK_DB_PASSWORD}

# 登录令牌的签名密钥从 Windows 环境变量读取。
citylink.jwt.secret=${CITYLINK_JWT_SECRET}